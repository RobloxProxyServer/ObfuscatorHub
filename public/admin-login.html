<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="shortcut icon" href="/favicon.ico" />
<title>Admin Login – ObfuscatorHub</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--cyan:#00f5ff;--pink:#ff2d78;--purple:#7c3aed;--red:#ff4455;--bg:#050508;--card:#0d0d14;--border:rgba(0,245,255,0.12);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:#e0e8ff;font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(124,58,237,0.10),transparent 60%);pointer-events:none;}

.panel{position:relative;width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 28px;text-align:center;}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.3;border-radius:16px 16px 0 0;}

.lock-icon{width:44px;height:44px;margin:0 auto 16px;border-radius:12px;background:rgba(0,245,255,0.07);border:1px solid rgba(0,245,255,0.25);display:flex;align-items:center;justify-content:center;color:var(--cyan);}

.brand-title{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
.brand-sub{font-size:10px;letter-spacing:2px;color:rgba(224,232,255,0.4);text-transform:uppercase;margin-bottom:26px;}

#adminKey{width:100%;background:rgba(0,0,0,0.5);border:1px solid var(--border);border-radius:9px;color:#e0e8ff;font-family:'JetBrains Mono',monospace;font-size:13px;padding:11px 14px;outline:none;text-align:center;letter-spacing:1px;transition:border-color .2s,box-shadow .2s;}
#adminKey:focus{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,245,255,0.18);}

button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:9px;cursor:pointer;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;background:linear-gradient(135deg,var(--cyan),var(--pink));color:#fff;transition:transform .15s,opacity .15s;}
button:hover{transform:translateY(-1px);}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.error{margin-top:14px;font-size:11px;color:var(--red);min-height:14px;}
</style>
</head>
<body>
<div class="panel">
  <div class="lock-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <div class="brand-title">🛡️ ObfuscatorHub</div>
  <div class="brand-sub">Admin Console</div>
  <input type="password" id="adminKey" placeholder="Admin key" autocomplete="off" autofocus>
  <button id="btnLogin">Unlock</button>
  <div class="error" id="err"></div>
</div>

<script>
async function attemptLogin(){
  const key = document.getElementById('adminKey').value.trim();
  const err = document.getElementById('err');
  const btn = document.getElementById('btnLogin');
  err.textContent = '';
  if (!key){ err.textContent = 'Enter the admin key.'; return; }
  btn.disabled = true;
  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key })
    });
    const data = await res.json();
    if (data.ok) {
      location.href = '/admin';
    } else {
      err.textContent = data.error || 'Invalid key.';
      btn.disabled = false;
    }
  } catch(e){
    err.textContent = 'Request failed: ' + e.message;
    btn.disabled = false;
  }
}
document.getElementById('btnLogin').addEventListener('click', attemptLogin);
document.getElementById('adminKey').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
</script>
</body>
</html>
